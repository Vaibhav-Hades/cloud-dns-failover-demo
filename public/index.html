<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud DNS Failover Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">CLOUD FAILOVER DEMO</h1>
    <section class="status-section" id="health-status">
      <h2>System Health</h2>
      <p id="health-message">Loading…</p>
    </section>
    <section class="info-section" id="info-section">
      <h2>Instance Details</h2>
      <ul>
        <li>Region: <span id="region">‑</span></li>
        <li>Role: <span id="role">‑</span></li>
        <li>Status: <span id="status">‑</span></li>
        <li>Health: <span id="health">‑</span></li>
        <li>Version: <span id="version">‑</span></li>
      </ul>
    </section>
    <footer class="footer">
      <p>© 2026 Cloud DNS Failover Demo</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
